name: Drafted
description: >-
  Drafted is a network-recruiting and employee-referral platform, founded in
  2015 and headquartered in Boston, Massachusetts, and surfaced in the API
  Evangelist network as a Y Combinator portfolio company. The product helps
  companies tap their collective network to source, qualify, and hire talent:
  a Drafted Slackbot delivers weekly intelligent referral recommendations and
  lets teams submit referrals straight into their ATS from Slack, while NLP,
  machine learning, and a graph database of the company network extend matching
  beyond first-degree employee connections to surface higher-quality referrals.
  Drafted has been used by thousands of companies ranging from startups to large
  enterprises. This profile was seeded from a VC-portfolio lead; at enrichment
  time the public web surface (drafted.us) was not serving a live product site
  and no public API, developer documentation, or specification could be found.
